# Production stack: Caddy (HTTPS) -> server -> Postgres + Redis. Run from this directory:
#   cp .env.production.example .env   # then fill it in (never commit it)
#   docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy publishes ports. Postgres and Redis live on an internal network with no route to the host or the Internet.
name: ${COMPOSE_PROJECT_NAME:-loop-prod}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  server:
    build: { context: .., dockerfile: apps/server/Dockerfile }
    image: ${LOOP_SERVER_IMAGE:-loop-server:local}
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://loop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/loop
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:?set LIVEKIT_API_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-app://loop}
      # Fixed on purpose: limiting on, exactly one proxy (Caddy) in front of the server.
      RATE_LIMIT: "on"
      TRUST_PROXY: "1"
    expose: ["3000"]
    networks: [backend, edge] # edge: outbound access to R2 and LiveKit Cloud, and Caddy

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: loop
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    # Pub/sub and rate-limit counters only: nothing worth persisting.
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      server: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3, optional
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep it, or Let's Encrypt rate limits bite on re-creation
      - caddy_config:/config
    networks: [edge]

networks:
  backend: { internal: true }
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
