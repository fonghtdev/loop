services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: loop
      POSTGRES_DB: loop
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the separate loop_test database on first init of the volume
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  # minio/minio left Docker Hub; bitnamilegacy/minio is the same server (frozen, fine for dev and CI-less tests)
  minio:
    image: bitnamilegacy/minio:2025.5.24
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: loopminio
      MINIO_ROOT_PASSWORD: loopminio-secret
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
  # one-shot: creates the dev and test buckets, then exits (idempotent)
  minio-init:
    image: bitnamilegacy/minio:2025.5.24
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 loopminio loopminio-secret &&
      mc mb --ignore-existing local/loop-uploads local/loop-test"
  # dev/test media server; production uses LiveKit Cloud (config: docker/livekit.yaml)
  livekit:
    image: livekit/livekit-server:v1.9.0
    command: --config /etc/livekit.yaml
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    extra_hosts: ["host.docker.internal:host-gateway"] # the webhook goes to the server on the host
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7880"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  miniodata:
