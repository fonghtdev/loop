name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: loop, POSTGRES_PASSWORD: loop, POSTGRES_DB: loop_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://loop:loop@localhost:5432/loop_test
      DATABASE_URL: postgresql://loop:loop@localhost:5432/loop_test
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: loop-test
      S3_ACCESS_KEY: loopminio
      S3_SECRET_KEY: loopminio-secret
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_URL: http://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: loop-dev-livekit-secret-0123456789abcdef
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # a service container cannot pass `server` args, so MinIO is started by hand (unverified: CI has never run)
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=loopminio -e MINIO_ROOT_PASSWORD=loopminio-secret bitnamilegacy/minio:2025.5.24
          timeout 60 sh -c 'until curl -sf http://localhost:9000/minio/health/ready; do sleep 1; done'
          docker exec minio mc alias set local http://localhost:9000 loopminio loopminio-secret
          docker exec minio mc mb --ignore-existing local/loop-test
      # same image, tag and config file as docker-compose (unverified: CI has never run); the webhook has no
      # server to reach in tests, host.docker.internal is only mapped so LiveKit does not log a DNS error
      - name: LiveKit
        run: |
          docker run -d --name livekit --add-host host.docker.internal:host-gateway -p 7880:7880 -p 7881:7881 -p 7882:7882/udp \
            -v "$GITHUB_WORKSPACE/docker/livekit.yaml:/etc/livekit.yaml:ro" livekit/livekit-server:v1.9.0 --config /etc/livekit.yaml
          timeout 60 sh -c 'until curl -sf http://localhost:7880; do sleep 1; done'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @loop/server db:deploy
      - run: pnpm test
