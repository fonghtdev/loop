# Packaging config. Builds are UNSIGNED; signing/notarization are driven by env vars (see README "Đóng gói và phát hành").
# appId is a placeholder: change it together with src/shared/app-id.ts (a test keeps the two equal).
appId: app.loop.desktop
productName: Loop
directories:
  output: release
  buildResources: build
# Only the built app goes into the asar (the runtime dependency electron-updater is added automatically).
files:
  - out/**
  - package.json
  - "!**/*.map"
# The tray icons: src/main/tray.ts reads them from process.resourcesPath when packaged.
extraResources:
  - from: resources
    to: resources
icon: build/icon.png
afterPack: scripts/adhoc-sign.cjs
mac:
  category: public.app-category.social-networking
  target: [dmg, zip]
  artifactName: Loop-${version}-${arch}.${ext} # no spaces: GitHub renames spaces in asset names, which would break the names inside latest*.yml
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  identity: null # unsigned: do not look for a certificate (set CSC_LINK + remove this line, or use CSC_NAME, to sign)
  extendInfo:
    NSMicrophoneUsageDescription: Loop cần dùng micro để bạn trò chuyện thoại trong kênh và cuộc gọi.
    NSCameraUsageDescription: Loop cần dùng camera để bạn bật video trong kênh và cuộc gọi.
    NSAudioCaptureUsageDescription: Loop cần ghi âm thanh hệ thống để chia sẻ tiếng của màn hình bạn đang phát (macOS 14.2 trở lên).
win:
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: Loop-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: true # unconditional: uninstalling from Windows Settings > Apps also removes the user data (account/server data is untouched)
# Makes the build write latest.yml / latest-mac.yml next to the artifacts (upload all of them to VITE_UPDATE_URL).
# The url is a placeholder: the file lists relative names, and the app is told the real feed by setFeedURL (src/main/updater.ts).
# The dist scripts pass --publish never, so electron-builder uploads nothing.
publish:
  provider: generic
  url: https://updates.invalid/loop
